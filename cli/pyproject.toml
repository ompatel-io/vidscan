[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vidscan"
version = "1.0.0"
description = "Media library scanner - folder and file level duration and size reports in txt, csv, or json with failed files listed in the reports"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",

    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",

    "License :: OSI Approved :: MIT License",

    "Operating System :: OS Independent",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Utilities",
    "Topic :: System :: Filesystems",]

[project.urls]
Homepage = "https://github.com/ompatel-io/vidscan"
"Bug Tracker" = "https://github.com/ompatel-io/vidscan/issues"

[project.scripts]
vidscan = "vidscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]