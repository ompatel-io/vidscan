[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vidscan"
version = "1.0.0"
description = "Concurrent media library scanner - folder and file level duration and size reports in txt, csv, and json via ffprobe"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/ompatel-io/vidscan"
"Bug Tracker" = "https://github.com/ompatel-io/vidscan/issues"

[project.scripts]
vidscan = "vidscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]