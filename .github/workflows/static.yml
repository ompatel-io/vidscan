name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
    # Runs only if changes are made in web/src folder or static.yml
    paths:
      - "web/src/**"
      - ".github/workflows/static.yml"

  # For running this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Limit deployments to one at a time for group - pages
  group: "pages"
  # Cancel running deployment if new pushed, save CI minutes
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Shallow clone (don't need the full git history to deploy), also save CI minutes
          fetch-depth: 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload ./web/src
          path: "./web/src"
          # Delete old artifact zips after 1 day, save storage
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
